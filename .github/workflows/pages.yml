name: Deploy Candle Outlook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate v3 production entrypoint
        run: |
          test -s index.html
          test -s js/app.js
          test -s js/journal.js
          test -s js/engine/geometry.js
          test -s js/engine/structure.js
          test -s js/engine/patterns.js
          test -s js/engine/scoring.js
          test -s js/engine/scenario.js
          test -s js/engine/mtf.js
          test -s js/engine/analyze.js
          test -s css/app.css
          grep -q 'id="tfGrid"' index.html
          grep -q 'id="analyzeBtn"' index.html
          grep -q 'id="result"' index.html
          grep -q 'type="module" src="js/app.js"' index.html
          grep -q 'BUY' js/app.js
          grep -q 'SELL' js/app.js
          grep -q 'WAIT' js/engine/analyze.js
      - name: JavaScript module syntax check
        run: |
          for f in js/app.js js/journal.js js/engine/*.js; do
            node --input-type=module --check < "$f"
          done

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
