name: Deploy Candle Outlook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate screenshot analyzer production entrypoint
        run: |
          test -s index.html
          test -s screenshot.html
          grep -q 'id="drop"' index.html
          grep -q 'id="analyze"' index.html
          grep -q 'function extract' index.html
          grep -q 'function pattern' index.html
          grep -q 'function analyze' index.html
          grep -q 'BUY' index.html
          grep -q 'SELL' index.html
          grep -q 'WAIT' index.html
          grep -q 'No demo candles' index.html
      - name: Basic inline script syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          assert m, 'inline script not found'
          Path('/tmp/candle-outlook.js').write_text(m.group(1))
          PY
          node --check /tmp/candle-outlook.js

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
